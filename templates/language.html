{{define "language-switcher"}}<nav class="language-switcher" aria-label="{{t "Язык сайта"}}"><span>{{t "Язык"}}</span>{{range .Languages}}<a href="{{.URL}}" lang="{{.Code}}" hreflang="{{.Code}}" rel="nofollow" {{if .Current}}aria-current="true"{{end}}>{{.Name}}</a>{{end}}<a href="{{.AutoURL}}" class="language-auto" rel="nofollow">{{t "Авто"}}</a></nav>{{end}}
{{define "language-client"}}<script type="application/json" id="i18n-messages">{{.ClientMessages}}</script><script src="{{asset "/static/i18n.js"}}" defer></script>{{end}}
